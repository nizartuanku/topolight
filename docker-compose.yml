services:
  topolight:
    build: .
    image: topolight:0.1.0
    container_name: topolight
    restart: unless-stopped
    ports:
      - "8432:8432"
      - "514:514/udp"
      - "514:514"
      - "162:162/udp"
    volumes:
      - topolight-data:/data
    environment:
      # Pro/Team key (or paste it in Admin → Licence)
      TOPOLIGHT_LICENSE: ""
      TOPOLIGHT_SMTP_PASS: ""
      TOPOLIGHT_TELEGRAM_TOKEN: ""
      TOPOLIGHT_WEBHOOK_SECRET: ""
volumes:
  topolight-data:
