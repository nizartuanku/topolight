services:
  topolight:
    build: .
    image: topolight:0.4.0
    container_name: topolight
    restart: unless-stopped
    ports:
      - "8433:8433"
      - "514:514/udp"
      - "514:514"
      - "162:162/udp"
      - "2055:2055/udp"
      - "6343:6343/udp"
      - "6514:6514"
    volumes:
      - topolight-data:/data
    environment:
      # Pro/Team key (or paste it in Admin → Licence)
      TOPOLIGHT_LICENSE: ""
      TOPOLIGHT_SMTP_PASS: ""
      TOPOLIGHT_TELEGRAM_TOKEN: ""
      TOPOLIGHT_WEBHOOK_SECRET: ""
volumes:
  topolight-data:
